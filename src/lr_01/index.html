<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triangle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,100..1000&display=swap" rel="stylesheet">
    <link href="./styles/style.css" rel="stylesheet">
    <script src="./scripts/app.js" type="module"></script>
</head>
<body>
    <header>
        <nav>
            <menu>
                <ul>
                    <li><a href="./test/reports/results.html" target="_blank">Отчет</a></li>
                    <li><a href="./test/coverage/lcov-report/index.html" target="_blank">Аналитика</a></li>
                </ul>
            </menu>
        </nav>
    </header>
    <main>
    <aside></aside>
    <article>
    <section style="max-width: 50em">
    <h1>Введите длины сторон треугольника</h1>
    <p class="size_small" id="admonition">значения должны быть натуральными числами</p>

    <form name="form_novalidate" novalidate>
        <fieldset name="inputs">
            <input type="text" name="a" pattern="^\d+$" required>
            <input type="text" name="b" pattern="^\d+$" required>
            <input type="text" name="c" pattern="^\d+$" required>
        </fieldset>
        <fieldset name="buttons">
            <input type="reset" value="Сброс"></button>
            <input type="submit" value="Проверить"></button>
        </fieldset>
        <fieldset name="outputs" class="border_on type_hidden">
            <legend>Result</legend>
            <output name="result"></output>
        </fieldset>
    </form>

    </section>
    </article>
    <aside></aside>
    </main>
</body>
</html>
